<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tablas</title>
	<link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
	<!-- Tabla de Horario-->
	<table border="2">
		<caption style="color:red;background-color:blue;">HORARIO</caption>
			<tr>
				<th>HORARIO</th>
				<th>Lunes</th>
				<th>Martes</th>
				<th>Miercoles</th>
				<th>Jueves</th>
				<th>Viernes</th>
			</tr>
			<tr>
				<td>1</td>
				<td rowspan="2" class="sistemas">Sistemas</td>
				<td rowspan="2">Aplicaciones</td>
				<td rowspan="2">Redes</td>
				<td class="sistemas">Sistemas</td>
				<td>Inglés</td>
			</tr>
			<tr>
				<td>2</td>
				

				
				<td class="seguridad">Seguridad</td>
				<td>Ipe 2</td>
			</tr>
			<tr>
				<td>3</td>
				<td>Redes</td>
				<td class="seguridad">Seguridad</td>
				<td>Proyecto</td>
				<td>Aplicaciones</td>
				<td>Redes</td>
			</tr>
			<tr>
				<td colspan="6">Recreo</td>
			</tr>
			<tr>
				<td>4</td>

				<td>Redes</td>
				<td>Ipe 2</td>
				<td>Proyecto</td>
				<td>Aplicaciones</td>
				<td>Redes</td>
			</tr>
			<tr>
				<td>5</td>
				<td class="seguridad">Seguridad</td>
				<td rowspan="2" class="sistemas">Sistemas</td>
				<td>Ipe 2</td>
				<td rowspan="2">Programación</td>
				<td class="sistemas">Sistemas</td>
			</tr>
			<tr>
				<td>6</td>
				<td>Inglés</td>
				
				<td>Programación</td>
				
				<td class="seguridad">Seguridad</td>
			</tr>
	</table>
</body>
</html>
